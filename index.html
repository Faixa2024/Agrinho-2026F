<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte, Futuro Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Section -->
    <header class="hero-section">
        <div class="overlay"></div>
        <div class="content">
            <h1>Agro Forte, Futuro Sustentável</h1>
            <p>Unindo a força do campo à preservação do planeta através da tecnologia.</p>
            <div class="button-group">
                <button class="btn btn-primary" onclick="scrollParaSection('tecnologia')">Conhecer Projetos</button>
                <button class="btn btn-secondary" onclick="mostrarAlerta()">Fale Conosco</button>
            </div>
        </div>
    </header>

    <!-- Section: Tecnologia -->
    <section id="tecnologia" class="info-section">
        <div class="container">
            <h2>Inovação no Campo</h2>
            <p>O agro moderno utiliza drones, inteligência artificial e monitoramento climático para reduzir o desperdício e aumentar a produtividade com respeito ao meio ambiente.</p>
            <button class="btn btn-primary" onclick="alterarFundo()">Mudar Visão</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
